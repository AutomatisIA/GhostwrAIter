name: Auto Release

# Publie automatiquement une release quand un push sur main porte une version
# (package.json) qui n'a pas encore de tag `vX.Y.Z`. La detection repose sur
# l'absence du tag (idempotent) : bumper la version puis pousser -> release ;
# pousser sans bump -> rien (le tag existe deja). Tout est dans CE workflow
# (pas de PAT requis) ; `softprops/action-gh-release` cree le tag lui-meme.

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.detect.outputs.release }}
      version: ${{ steps.detect.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Detect new version (no tag yet)
        id: detect
        shell: bash
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          echo "version=$CURRENT" >> "$GITHUB_OUTPUT"
          if [ -z "$CURRENT" ]; then
            echo "Aucune version dans package.json, skip."
            echo "release=false" >> "$GITHUB_OUTPUT"
          elif git rev-parse "v$CURRENT" >/dev/null 2>&1; then
            echo "Tag v$CURRENT existe deja (pas de bump), skip."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Version v$CURRENT sans tag : release a creer."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  # Chaine de verification complete, portee PAR ce workflow.
  #
  # `ci.yml` part sur le meme push, mais c'est une execution independante :
  # avant ce job, une CI rouge et une release publique pouvaient coexister,
  # parce que `package` ne dependait que de `check-version`. Rien ne gatait la
  # publication.
  #
  # Les etapes sont dupliquees avec `ci.yml` plutot que factorisees dans un
  # workflow appele. C'est un choix : la chaine qui publie se relit dans son
  # propre YAML, donc elle se teste dans `tests/unit/ci-workflows.test.ts`, et
  # sa panne ne peut pas etre silencieuse. Les deux listes sont verrouillees
  # ensemble par ce fichier de test, qui exige qu'elles portent les memes
  # commandes : elles ne peuvent pas deriver sans faire tomber un test.
  #
  # Le `if` est le meme que celui de `package` : sur un push sans bump de
  # version, les deux jobs sont ignores ensemble et rien ne tourne deux fois.
  # Sur un push AVEC bump, la chaine tourne une seconde fois, en plus de
  # `ci.yml`. Cout assume : une release est rare.
  #
  # Aucun `always()` ni `!cancelled()` sur `package` ni sur `publish` : ces
  # expressions font tourner un job dont une dependance a ete IGNOREE ou a
  # ECHOUE, ce qui rouvrirait le chemin qu'on ferme ici. Verrouille par
  # `tests/unit/ci-workflows.test.ts`.
  checks:
    needs: check-version
    if: needs.check-version.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules for Electron target
        run: npm run rebuild:native:electron

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Security audit (production dependencies only)
        run: npm audit --audit-level=high --omit=dev

      - name: Palette contrast (WCAG AA on both themes)
        run: npm run audit:contraste

      - name: Verify hardening (macOS only)
        if: runner.os == 'macOS'
        run: npm run verify-hardening

  package:
    needs:
      - check-version
      - checks
    if: needs.check-version.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules for Electron target
        run: npm run rebuild:native:electron

      - name: Build Electron app
        run: npm run build

      - name: Package for macOS
        if: matrix.os == 'macos-latest'
        run: npx electron-builder --mac --publish never
        env:
          # Signature Developer ID + notarisation (secrets repo, cf. CLAUDE.md).
          # Absents -> build non signe (comme avant). Presents -> signe + notarise.
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Package for Linux
        if: matrix.os == 'ubuntu-latest'
        run: npx electron-builder --linux --publish never

      - name: Package for Windows
        if: matrix.os == 'windows-latest'
        run: npx electron-builder --win --publish never

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ghostwraiter-v${{ needs.check-version.outputs.version }}-${{ matrix.os }}
          path: |
            dist-app/*.dmg
            dist-app/*.exe
            dist-app/*.AppImage
            dist-app/*.deb
            dist-app/*.yml
            dist-app/*.blockmap
          if-no-files-found: error

  publish:
    needs:
      - check-version
      - package
    runs-on: ubuntu-latest
    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: ghostwraiter-v${{ needs.check-version.outputs.version }}-*
          merge-multiple: true

      - name: Create and publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          tag_name: v${{ needs.check-version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ needs.check-version.outputs.version }}
          generate_release_notes: true
          # Le defaut de cette entree est `false` (verifie dans l'`action.yml`
          # de softprops/action-gh-release : « Fails if any of the `files` globs
          # match nothing. Defaults to false »). Sans elle, un motif qui ne
          # correspond a rien publie une release VERTE, avec son tag public, et
          # sans le moindre binaire attache. Un utilisateur arrive sur une page
          # de release vide et l'echec n'apparait nulle part.
          fail_on_unmatched_files: true
          files: |
            artifacts/*.dmg
            artifacts/*.exe
            artifacts/*.AppImage
            artifacts/*.deb
          token: ${{ secrets.GITHUB_TOKEN }}
