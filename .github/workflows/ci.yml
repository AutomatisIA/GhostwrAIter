name: CI

# Les memes etapes figurent dans le job `checks` de `auto-release.yml`, et
# c'est delibere. La chaine qui publie ne doit dependre d'aucun montage dont la
# panne serait silencieuse : elle porte ses propres etapes, lisibles dans son
# YAML, donc verifiables par `tests/unit/ci-workflows.test.ts`. La duplication
# est le prix, et il est faible devant une release publiee sur une porte rouge.
# Les deux listes d'etapes sont verrouillees ensemble par ce meme fichier de
# test, qui exige qu'elles portent les memes commandes.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `npm ci` reports success even when Electron's postinstall failed to
      # extract, which leaves node_modules/electron without a binary. The
      # failure then surfaces much later, in the first test file that imports
      # electron-log, saying "Electron failed to install correctly".
      - name: Verify the Electron install, repair it if incomplete
        run: node scripts/ensure-electron.mjs

      - name: Rebuild native modules for Electron target
        run: npm run rebuild:native:electron

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Security audit (production dependencies only)
        run: npm audit --audit-level=high --omit=dev

      - name: Palette contrast (WCAG AA on both themes)
        run: npm run audit:contraste

      - name: Verify hardening (macOS only)
        if: runner.os == 'macOS'
        run: npm run verify-hardening
