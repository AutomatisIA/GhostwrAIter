name: Package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules for Electron target
        run: npm run rebuild:native:electron

      - name: Build Electron app
        run: npm run build

      # Meme decoupage que dans `auto-release.yml`, et pour la meme raison : un
      # secret non configure vaut la CHAINE VIDE, pas rien, et `CSC_LINK: ""`
      # fait echouer electron-builder sur « not a file ». Voir le commentaire
      # long dans `auto-release.yml`.
      - name: Detect macOS signing configuration
        id: signing
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          CERTIFICAT: ${{ secrets.MAC_CSC_LINK }}
          MOT_DE_PASSE: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          IDENTIFIANT: ${{ secrets.APPLE_ID }}
          MOT_DE_PASSE_APP: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          EQUIPE: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$CERTIFICAT" ]; then
            echo "Aucun certificat Developer ID : build NON SIGNE."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          manquants=""
          [ -z "$MOT_DE_PASSE" ]     && manquants="$manquants MAC_CSC_KEY_PASSWORD"
          [ -z "$IDENTIFIANT" ]      && manquants="$manquants APPLE_ID"
          [ -z "$MOT_DE_PASSE_APP" ] && manquants="$manquants APPLE_APP_SPECIFIC_PASSWORD"
          [ -z "$EQUIPE" ]           && manquants="$manquants APPLE_TEAM_ID"

          if [ -n "$manquants" ]; then
            echo "::error::Certificat present mais configuration incomplete. Secrets manquants :$manquants"
            echo "La signature reussirait et la notarisation echouerait apres le build."
            echo "Poser les secrets manquants, ou retirer MAC_CSC_LINK pour un build non signe."
            exit 1
          fi

          echo "Les cinq secrets sont poses : build signe et notarise."
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Package for macOS (signed and notarized)
        if: matrix.os == 'macos-latest' && steps.signing.outputs.configured == 'true'
        run: npx electron-builder --mac --publish never
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Package for macOS (unsigned)
        if: matrix.os == 'macos-latest' && steps.signing.outputs.configured != 'true'
        run: npx electron-builder --mac --publish never --config.mac.notarize=false
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Package for Linux
        if: matrix.os == 'ubuntu-latest'
        run: npx electron-builder --linux --publish never

      - name: Package for Windows
        if: matrix.os == 'windows-latest'
        run: npx electron-builder --win --publish never

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ghostwraiter-${{ github.ref_name }}-${{ matrix.os }}
          path: |
            dist-app/*.dmg
            dist-app/*.exe
            dist-app/*.AppImage
            dist-app/*.deb
            dist-app/*.yml
            dist-app/*.blockmap
          if-no-files-found: error
